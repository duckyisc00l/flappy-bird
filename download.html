<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Download Flappy Bird</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #4ec0ca; font-family: -apple-system, system-ui, sans-serif; color: #533846; }
  .card { background: #ded895; border: 4px solid #533846; border-radius: 12px; padding: 24px 22px; max-width: 340px; margin: 16px; text-align: center; box-shadow: 0 6px 0 rgba(0,0,0,.25); }
  h1 { margin: 0 0 8px; font-size: 22px; }
  p { margin: 8px 0; font-size: 15px; line-height: 1.4; }
  a.btn { display: inline-block; margin-top: 10px; padding: 12px 20px; background: #fc7858; color: #fff; text-decoration: none; font-weight: 700; border: 3px solid #533846; border-radius: 10px; }
  small { display: block; margin-top: 12px; opacity: .75; }
</style>
</head>
<body>
<div class="card">
  <h1>Flappy Bird</h1>
  <p>The whole game in one HTML file. It works offline.</p>
  <a class="btn" id="dl" href="app.html" download="flappy-bird.html">Download flappy-bird.html</a>
  <small id="ver"></small>
</div>
<script>
  // the download starts by itself; the button is there if it doesn't
  fetch('version.json', { cache: 'no-store' }).then(r => r.json()).then(v => { document.getElementById('ver').textContent = 'Version ' + v.version + ' (build ' + v.build + ')'; }).catch(() => {});
  setTimeout(() => { try { document.getElementById('dl').click(); } catch (e) {} }, 400);
</script>
</body>
</html>
