name: Build iOS IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/build-ipa.yml"]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html sw.js manifest.webmanifest icon-*.png www/
      - name: Create Capacitor iOS project
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/ios
          npx cap init "Flappy Bird" com.duckyisc00l.flappybird --web-dir www
          npx cap add ios
          npx cap sync ios
      - name: Set app icon
        run: |
          D=ios/App/App/Assets.xcassets/AppIcon.appiconset
          [ -d "$D" ] && sips -z 1024 1024 icon-512.png --out "$D/AppIcon-512@2x.png" || true
      - name: Build unsigned
        working-directory: ios/App
        run: |
          if [ -d App.xcworkspace ]; then T="-workspace App.xcworkspace"; else T="-project App.xcodeproj"; fi
          xcodebuild $T -scheme App -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
      - name: Package IPA
        run: |
          APP=$(find ios/App/build -type d -name "App.app" -path "*Release-iphoneos*" | head -1)
          mkdir Payload && cp -R "$APP" Payload/
          zip -qry FlappyBird.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: FlappyBird-ipa
          path: FlappyBird.ipa
